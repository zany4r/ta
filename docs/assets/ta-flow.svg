<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <!-- Box 1 -->
  <rect x="28" y="45" width="195" height="130" rx="10" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="82" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Any Target</text>
  <text x="125" y="106" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Atari · NES · GBA · N64</text>
  <text x="125" y="124" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">ISO · EXE · ELF · WASM</text>
  <text x="125" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">ASAR · APK · JSON · SRT</text>

  <!-- Arrow 1 -->
  <path d="M228 110 L262 110" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="260,104 272,110 260,116" fill="#8b5cf6"/>

  <!-- Box 2 -->
  <rect x="276" y="45" width="205" height="130" rx="10" fill="#161b22" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="378" y="82" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. Reverse Engineer</text>
  <text x="378" y="106" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Ghidra · IDA Pro · JADX</text>
  <text x="378" y="124" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">ISO-9660 · ASAR · ZIP</text>
  <text x="378" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Offsets · Xrefs · C Code</text>

  <!-- Arrow 2 -->
  <path d="M486 110 L520 110" stroke="url(#accent)" stroke-width="2.5"/>
  <polygon points="518,104 530,110 518,116" fill="#8b5cf6"/>

  <!-- Box 3 -->
  <rect x="534" y="45" width="190" height="130" rx="10" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
  <text x="629" y="82" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3. Edge Translator</text>
  <text x="629" y="106" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Auto-Detect Language</text>
  <text x="629" y="124" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Smart Batching · Retry</text>
  <text x="629" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">%s {0} Placeholder Guard</text>

  <!-- Arrow 3 -->
  <path d="M729 110 L763 110" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="761,104 773,110 761,116" fill="#10b981"/>

  <!-- Box 4 -->
  <rect x="777" y="45" width="155" height="130" rx="10" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="854" y="82" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4. Patch &amp; Ship</text>
  <text x="854" y="106" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">In-Place ROM Patch</text>
  <text x="854" y="124" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">Zero-Shift Offsets</text>
  <text x="854" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="11">JSON · SRT · Manifest</text>
</svg>
